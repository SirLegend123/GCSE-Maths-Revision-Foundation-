<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Algebra Practice</title>
<meta name="description" content="GCSE Foundation algebra practice: brackets, equations, formulae and sequences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap">
<style>
/* Same look as Ratio Sun Rays and the cover page: Lexend, cream background, generous spacing, no italics. */
:root{
  --font:'Lexend', Verdana, Tahoma, system-ui, sans-serif;
  --bg:#FBF6E4; --surface:#FFFCF2; --surface-2:#F3EEDB; --ink:#1F2A44; --ink-soft:#46506A; --line:#D9D0B4;
  --sun:#F4BE1E; --sun-deep:#C99700; --sun-ink:#231A00;
  --teal:#1B7F79; --teal-deep:#11605B; --teal-soft:#DDF0EE;
  --good:#2C9659; --good-deep:#1F7343; --good-soft:#DFF3E6;
  --warm:#D9822B; --warm-soft:#FBE8D3;
  --berry:#7A4FA0; --berry-soft:#EFE4F6;
  --on-accent:#FFFFFF; --shadow:rgba(31,42,68,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1914; --surface:#24262E; --surface-2:#2D313B; --ink:#EDEADF; --ink-soft:#BDBBB0; --line:#404552;
    --sun:#F5C432; --sun-deep:#B88E0A; --sun-ink:#1E1600;
    --teal:#4CC2B8; --teal-deep:#2E8E86; --teal-soft:#173836;
    --good:#5DD08C; --good-deep:#3A9A62; --good-soft:#173526;
    --warm:#F0A35E; --warm-soft:#3A2818;
    --berry:#C9A2EA; --berry-soft:#2E2238;
    --on-accent:#0E1A14; --shadow:rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1914; --surface:#24262E; --surface-2:#2D313B; --ink:#EDEADF; --ink-soft:#BDBBB0; --line:#404552;
  --sun:#F5C432; --sun-deep:#B88E0A; --sun-ink:#1E1600;
  --teal:#4CC2B8; --teal-deep:#2E8E86; --teal-soft:#173836;
  --good:#5DD08C; --good-deep:#3A9A62; --good-soft:#173526;
  --warm:#F0A35E; --warm-soft:#3A2818;
  --berry:#C9A2EA; --berry-soft:#2E2238;
  --on-accent:#0E1A14; --shadow:rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; font-family:var(--font); font-size:19px; line-height:1.7; letter-spacing:.02em; word-spacing:.08em; background:var(--bg); color:var(--ink)}
button,input{font:inherit; color:inherit; letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:4px solid var(--teal); outline-offset:3px; border-radius:12px}
.app{max-width:760px; margin:0 auto; padding:14px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:20px}
h1,h2{margin:0; line-height:1.3; font-weight:800}
h1{font-size:1.7em} h2{font-size:1.25em}
p{margin:0}
.muted{color:var(--ink-soft)} .small{font-size:.88em}
.eyebrow{font-size:.85em; font-weight:700; color:var(--berry)}

.bar{display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; margin-right:auto; background:none; border:0; padding:4px 0; cursor:pointer; text-align:left; min-width:0}
.logo{width:40px; height:40px; border-radius:12px; background:var(--berry-soft); color:var(--berry); display:grid; place-items:center; font-weight:800; font-size:.75em; flex:none; letter-spacing:0}
.iconbtn{width:46px; height:46px; border-radius:14px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:10px 22px; border-radius:18px; border:0; font-weight:700; cursor:pointer; background:var(--sun); color:var(--sun-ink); box-shadow:0 5px 0 var(--sun-deep); text-decoration:none}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--sun-deep)}
.btn.teal{background:var(--teal); color:var(--on-accent); box-shadow:0 5px 0 var(--teal-deep)}
.btn.good{background:var(--good); color:var(--on-accent); box-shadow:0 5px 0 var(--good-deep)}
.btn.ghost{background:var(--surface); color:var(--ink); border:2px solid var(--line); box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:46px; padding:8px 14px; font-size:.9em; border-radius:14px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}

/* session picker */
.sessions{display:flex; flex-direction:column; gap:14px}
.session{display:flex; flex-direction:column; gap:8px; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:22px; padding:18px; cursor:pointer; box-shadow:0 5px 0 var(--shadow)}
.session:hover{border-color:var(--teal)}
.session .top{display:flex; justify-content:space-between; gap:10px; align-items:center}
.num{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-weight:800; background:var(--berry-soft); color:var(--berry); flex:none}
.session b{font-size:1.1em}
.session .eg{font-size:.88em; color:var(--ink-soft)}
.best{font-size:.8em; font-weight:700; color:var(--ink-soft); white-space:nowrap}

/* question */
.playtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.dots{display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0}
.dots i{width:16px; height:16px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line)}
.dots i.s3{background:var(--good); border-color:var(--good)}
.dots i.s1{background:var(--sun); border-color:var(--sun-deep)}
.dots i.s0{background:var(--warm); border-color:var(--warm)}
.dots i.now{border-color:var(--ink)}
.qcard{background:var(--surface); border:3px solid var(--ink); border-radius:26px; padding:22px; display:flex; flex-direction:column; gap:16px; box-shadow:0 8px 0 var(--ink)}
.qtext{font-size:1.25em; font-weight:600; line-height:1.55}
.marks{display:inline-block; font-size:.62em; font-weight:700; color:var(--ink-soft); background:var(--surface-2); border-radius:999px; padding:2px 10px; vertical-align:middle; margin-left:4px}
.m{font-weight:800; white-space:nowrap}
.working{background:var(--surface-2); border-radius:16px; padding:12px 16px; font-weight:700; display:flex; flex-direction:column; gap:2px}
.fields{display:flex; flex-direction:column; gap:10px}
.field{display:flex; align-items:center; border:3px solid var(--line); border-radius:18px; background:var(--surface); padding:0 14px; gap:8px}
.field:focus-within{border-color:var(--teal)}
.field span{font-weight:800; font-size:1.2em; color:var(--ink-soft); white-space:nowrap}
.field input{border:0; outline:0; background:transparent; font-size:1.4em; font-weight:800; width:100%; min-width:0; padding:10px 0}
.keys{display:flex; flex-wrap:wrap; gap:8px}
.keys button{min-width:52px; min-height:50px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-weight:800; font-size:1.1em; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.keys button:active{transform:translateY(2px); box-shadow:none}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.actions .btn{width:100%}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:16px; padding:12px 16px; cursor:pointer; font-weight:600; box-shadow:0 3px 0 var(--line)}
.choice:hover{border-color:var(--teal)}
.choice.picked-no{border-color:var(--warm); background:var(--warm-soft)}
.choice:disabled{cursor:default; opacity:.6}
.help{background:var(--berry-soft); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:10px}
.steps{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:4px}
.feedback{border-radius:20px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--warm-soft)}
.feedback .head{font-weight:800; font-size:1.1em}
.tipcard{display:flex; gap:12px; align-items:flex-start; background:var(--teal-soft); border-radius:20px; padding:16px 18px}
.score{font-size:3em; font-weight:800; line-height:1}
.stars{display:flex; gap:8px; justify-content:center}
.review{display:flex; flex-direction:column; gap:10px}
.rv{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start}
.rv .pip{flex:none; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.75em}
.rv .pip.s3{background:var(--good); color:var(--on-accent)} .rv .pip.s1{background:var(--sun); color:var(--sun-ink)} .rv .pip.s0{background:var(--warm); color:#1E1000}
.rv > div{min-width:0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
[hidden]{display:none!important}
@media (max-width:420px){ .qcard{padding:16px} .qtext{font-size:1.12em} .brand{font-size:.92em} .bar .btn.sm{padding:8px 12px} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- helpers ---------------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
// Wrap maths in a no-wrap span so "2x + 18" never breaks across lines. Written as {…} in the question text.
const fmt = s => esc(s).replace(/\{([^}]*)\}/g, '<span class="m">$1</span>');
const plain = s => String(s).replace(/[{}]/g, "");

/* ---------------- algebra checking ---------------- */
// Turn what she typed into something the checker understands.
function norm(s){
  return String(s).toLowerCase()
    .replace(/[−–—]/g, "-").replace(/[×]/g, "*").replace(/[÷]/g, "/").replace(/²/g, "^2").replace(/³/g, "^3")
    .replace(/\s+/g, "");
}
// A small parser: numbers, one-letter variables, + − × ÷ ^, brackets, and "2x" or "3(x+1)" style multiplication.
function compile(src){
  const toks = src.match(/\d+\.?\d*|\.\d+|[a-z]|[-+*/^()]/g);
  if (!toks || toks.join("") !== src) return null;
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  function expr(){ let f = term(); while (peek() === "+" || peek() === "-"){ const op = next(), a = f, b = term(); if (!b) return null; f = op === "+" ? e => a(e) + b(e) : e => a(e) - b(e); } return f; }
  function term(){ let f = unary(); if (!f) return null;
    while (true){
      const t = peek();
      if (t === "*" || t === "/"){ next(); const a = f, b = unary(); if (!b) return null; f = t === "*" ? e => a(e) * b(e) : e => a(e) / b(e); }
      else if (t !== undefined && (/^[a-z0-9.]/.test(t) || t === "(")){ const a = f, b = power(); if (!b) return null; f = e => a(e) * b(e); }
      else return f;
    } }
  function unary(){ if (peek() === "-"){ next(); const a = unary(); return a ? e => -a(e) : null; } if (peek() === "+"){ next(); return unary(); } return power(); }
  function power(){ const a = atom(); if (!a) return null; if (peek() === "^"){ next(); const b = unary(); if (!b) return null; return e => Math.pow(a(e), b(e)); } return a; }
  function atom(){ const t = next();
    if (t === undefined) return null;
    if (t === "("){ const a = expr(); if (!a || next() !== ")") return null; return a; }
    if (/^[\d.]/.test(t)){ const v = parseFloat(t); return () => v; }
    if (/^[a-z]$/.test(t)) return e => e[t];
    return null; }
  const f = expr();
  return f && i === toks.length ? f : null;
}
// Two expressions are the same if they give the same value for lots of different values of the letters.
function same(a, b){
  const fa = compile(a), fb = compile(b);
  if (!fa || !fb) return false;
  const letters = [...new Set((a + b).match(/[a-z]/g) || [])];
  for (let k = 0; k < 6; k++){
    const env = {}; letters.forEach((l, j) => env[l] = 1.37 + k * 0.91 + j * 0.53);
    const x = fa(env), y = fb(env);
    if (!isFinite(x) || !isFinite(y) || Math.abs(x - y) > 1e-6 * Math.max(1, Math.abs(y))) return false;
  }
  return true;
}
// Remove "x =" from the front, and units at the end.
const stripLead = s => s.replace(/^[a-z]+=/, "");
const asNumber = s => { const t = stripLead(norm(s)).replace(/(cm|°|degrees|years|yrs)$/, ""); return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : NaN; };

/* ---------------- the questions (from Sophie's Autumn 1 sheets) ---------------- */
// type: num | expand | factor | formula | choice | multi
const SESSIONS = [
 {id:"s1", name:"Session 1: Brackets and equations", eg:"Expand and factorise brackets. Solve equations with brackets, and with x on both sides.", qs:[
  {text:"Solve {5x + 3 = 2x + 18}", marks:2, type:"num", ans:5, pre:"x =",
   tip:"Get all the x's on one side first.",
   steps:["Take {2x} from both sides: {3x + 3 = 18}", "Take {3} from both sides: {3x = 15}", "Divide by {3}: {x = 5}"],
   mistakes:[[15, "{3x = 15}. Now divide by 3."], [3, "Check: take 2x from 5x. That leaves 3x, and 18 − 3 = 15."]]},
  {text:"Expand {4(x + 5)}", marks:1, type:"expand", ans:"4x+20", show:"4x + 20",
   tip:"Multiply everything inside the bracket by the 4.",
   steps:["{4 × x = 4x}", "{4 × 5 = 20}", "So {4(x + 5) = 4x + 20}"],
   mistakes:[["4x+5", "Multiply the 5 by 4 as well."], ["x+20", "Multiply the x by 4 as well."]]},
  {text:"Expand {3(2y − 7)}", marks:1, type:"expand", ans:"6y-21", show:"6y − 21",
   tip:"Multiply both things in the bracket by 3. Keep the minus sign.",
   steps:["{3 × 2y = 6y}", "{3 × −7 = −21}", "So {3(2y − 7) = 6y − 21}"],
   mistakes:[["6y-7", "Multiply the 7 by 3 as well."], ["6y+21", "3 × −7 is −21. Keep the minus sign."], ["5y-7", "Multiply, don't add: 3 × 2y = 6y."]]},
  {text:"Expand and simplify {2(x + 4) + 3(x − 1)}", marks:2, type:"expand", ans:"5x+5", show:"5x + 5",
   tip:"Expand each bracket on its own first. Then collect the x's and the numbers.",
   steps:["{2(x + 4) = 2x + 8}", "{3(x − 1) = 3x − 3}", "Collect: {2x + 3x = 5x} and {8 − 3 = 5}", "So the answer is {5x + 5}"],
   mistakes:[["5x+11", "3 × −1 is −3, so it is 8 − 3, not 8 + 3."], ["5x+3", "Multiply the numbers inside the brackets too: 2 × 4 and 3 × −1."]]},
  {text:"Factorise {6x + 15}", marks:1, type:"factor", ans:"3(2x+5)", outside:"3", show:"3(2x + 5)",
   tip:"Find the biggest number that goes into 6 and 15. Put it outside the bracket.",
   steps:["3 goes into 6 and 15", "{6x ÷ 3 = 2x} and {15 ÷ 3 = 5}", "So {6x + 15 = 3(2x + 5)}"]},
  {text:"Factorise fully {8y − 12}", marks:1, type:"factor", ans:"4(2y-3)", outside:"4", show:"4(2y − 3)",
   tip:"\"Fully\" means use the biggest number that goes into 8 and 12.",
   steps:["4 is the biggest number that goes into 8 and 12", "{8y ÷ 4 = 2y} and {12 ÷ 4 = 3}", "So {8y − 12 = 4(2y − 3)}"]},
  {text:"Factorise {x² + 7x}", marks:1, type:"factor", ans:"x(x+7)", outside:"x", show:"x(x + 7)",
   tip:"Both parts have an x in them. Put the x outside the bracket.",
   steps:["{x²} is {x × x}, and {7x} is {7 × x}", "So x goes outside", "{x² + 7x = x(x + 7)}"]},
  {text:"Solve {3(x + 2) = 21}", marks:2, type:"num", ans:5, pre:"x =",
   tip:"Expand the bracket first, or divide both sides by 3.",
   steps:["Divide both sides by {3}: {x + 2 = 7}", "Take {2} from both sides: {x = 5}"],
   mistakes:[[19/3, "Multiply the 2 by 3 as well: 3(x + 2) = 3x + 6."], [7, "x + 2 = 7. Now take 2 away."]]},
  {text:"Solve {4(2x − 1) = 28}", marks:2, type:"num", ans:4, pre:"x =",
   tip:"Expand the bracket first.",
   steps:["Expand: {8x − 4 = 28}", "Add {4} to both sides: {8x = 32}", "Divide by {8}: {x = 4}"],
   mistakes:[[3, "−4 means you add 4 to both sides: 28 + 4 = 32."], [29/8, "Multiply the 1 by 4 as well: 4(2x − 1) = 8x − 4."], [32, "8x = 32. Now divide by 8."]]},
  {text:"Solve {2(x + 5) = x + 14}", marks:3, type:"num", ans:4, pre:"x =",
   tip:"Expand the bracket. Then get the x's on one side.",
   steps:["Expand: {2x + 10 = x + 14}", "Take {x} from both sides: {x + 10 = 14}", "Take {10} from both sides: {x = 4}"],
   mistakes:[[9, "Multiply the 5 by 2 as well: 2(x + 5) = 2x + 10."], [8, "Take x from both sides first: 2x − x = x."]]},
  {text:"Solve {3(2x − 1) = 2(x + 7) + 3}", marks:3, type:"num", ans:5, pre:"x =",
   tip:"Expand both brackets. Tidy up the right side. Then get the x's on one side.",
   steps:["Expand: {6x − 3 = 2x + 14 + 3}", "Tidy up: {6x − 3 = 2x + 17}", "Take {2x} from both sides: {4x − 3 = 17}", "Add {3}: {4x = 20}", "Divide by {4}: {x = 5}"],
   mistakes:[[3.5, "Remember the + 3 on the right: 2x + 14 + 3 = 2x + 17."], [20, "4x = 20. Now divide by 4."]]},
  {text:"Amir tries to solve {4(x − 3) = 20}. Here is his working:", working:["4x − 3 = 20", "4x = 23", "x = 5.75"],
   ask:"What mistake has Amir made?", marks:1, type:"choice",
   options:[
     {t:"He did not multiply the 3 by 4", ok:true, why:"4(x − 3) is 4x − 12, not 4x − 3."},
     {t:"He added 3 when he should have taken it away", why:"Adding 3 to both sides was the right move for 4x − 3. The mistake is earlier."},
     {t:"He should have divided 20 by 4 first", why:"Dividing first is another way to do it, but expanding is fine too. Look at his first line."},
     {t:"He divided by 4 at the end", why:"Dividing 4x by 4 is right. Look at his first line."}],
   tip:"Expand {4(x − 3)} yourself. Does it match his first line?",
   steps:["{4(x − 3) = 4x − 12}", "Amir wrote {4x − 3}", "He did not multiply the 3 by 4"]},
  {text:"Now solve {4(x − 3) = 20} correctly.", marks:1, type:"num", ans:8, pre:"x =",
   tip:"Expand properly: multiply the 3 by 4 too.",
   steps:["Expand: {4x − 12 = 20}", "Add {12}: {4x = 32}", "Divide by {4}: {x = 8}"],
   mistakes:[[5.75, "That is Amir's answer. Multiply the 3 by 4: 4x − 12 = 20."], [2, "−12 means you add 12 to both sides: 20 + 12 = 32."]]}
 ]},
 {id:"s2", name:"Session 2: Forming equations, formulae and sequences", eg:"Substitute into formulae, rearrange, write equations from words, and the nth term.", qs:[
  {text:"{a = 4} and {b = −2}. Work out the value of {3a + 5b}", marks:2, type:"num", ans:2,
   tip:"Swap the letters for their numbers. 3a means 3 × a.",
   steps:["{3a = 3 × 4 = 12}", "{5b = 5 × −2 = −10}", "{12 + −10 = 2}"],
   mistakes:[[22, "5 × −2 is −10, not +10."], [-22, "3 × 4 = 12 is positive. Only the 5b part is negative."], [5, "3a means 3 × a, not 3 + a."]]},
  {text:"The perimeter of a rectangle is {P = 2l + 2w}. Work out P when {l = 7.5} and {w = 4}", marks:2, type:"num", ans:23, pre:"P =",
   tip:"2l means 2 × l. Work out each part, then add.",
   steps:["{2l = 2 × 7.5 = 15}", "{2w = 2 × 4 = 8}", "{P = 15 + 8 = 23}"],
   mistakes:[[11.5, "2l means 2 × l, and 2w means 2 × w."], [19, "2 × 7.5 is 15, not 11."]]},
  {text:"{v = u + at}. Work out v when {u = 10}, {a = 3} and {t = 6}", marks:2, type:"num", ans:28, pre:"v =",
   tip:"at means a × t. Do that first, then add u.",
   steps:["{at = 3 × 6 = 18}", "{v = 10 + 18 = 28}"],
   mistakes:[[78, "Multiply a × t first, then add u. Not (10 + 3) × 6."], [19, "at means a × t, not a + t."]]},
  {text:"Make x the subject of {y = 3x + 7}", marks:2, type:"formula", ans:"(y-7)/3", subject:"x", pre:"x =", show:"x = (y − 7) ÷ 3",
   tip:"Undo the + 7 first, then undo the × 3. Type ÷ or / for divide.",
   steps:["Take {7} from both sides: {y − 7 = 3x}", "Divide both sides by {3}", "{x = (y − 7) ÷ 3}"],
   mistakes:[["y/3-7", "Take the 7 away first, then divide all of (y − 7) by 3."], ["(y+7)/3", "+ 7 is undone by taking 7 away: y − 7."], ["3(y-7)", "× 3 is undone by dividing by 3."]]},
  {text:"Make t the subject of {v = u + at}", marks:2, type:"formula", ans:"(v-u)/a", subject:"t", pre:"t =", show:"t = (v − u) ÷ a",
   tip:"Undo the + u first, then undo the × a.",
   steps:["Take {u} from both sides: {v − u = at}", "Divide both sides by {a}", "{t = (v − u) ÷ a}"],
   mistakes:[["v/a-u", "Take the u away first, then divide all of (v − u) by a."], ["(v+u)/a", "+ u is undone by taking u away: v − u."]]},
  {text:"I think of a number. I multiply it by 4, then subtract 7. My answer is 29. What is my number?", marks:3, type:"num", ans:9,
   tip:"Call the number n. Write the equation {4n − 7 = 29}.",
   steps:["Equation: {4n − 7 = 29}", "Add {7}: {4n = 36}", "Divide by {4}: {n = 9}"],
   mistakes:[[5.5, "−7 means you add 7 to both sides: 29 + 7 = 36."], [36, "4n = 36. Now divide by 4."]]},
  {text:"Three angles lie on a straight line. They are {x°}, {2x°} and {(3x + 30)°}. Work out the value of x.", marks:3, type:"num", ans:25, pre:"x =",
   tip:"Angles on a straight line add up to 180°.",
   steps:["{x + 2x + 3x + 30 = 180}", "Collect: {6x + 30 = 180}", "Take {30}: {6x = 150}", "Divide by {6}: {x = 25}"],
   mistakes:[[55, "Angles on a straight line add up to 180°, not 360°."], [35, "Take 30 away from 180 first: 6x = 150."], [150, "6x = 150. Now divide by 6."]]},
  {text:"A rectangle has length {(2x + 3) cm} and width {(x − 1) cm}. Write an expression for its perimeter. Simplify it.", marks:2, type:"expand", ans:"6x+4", show:"6x + 4",
   tip:"Perimeter = all four sides added: length + width + length + width.",
   steps:["{2(2x + 3) + 2(x − 1)}", "{= 4x + 6 + 2x − 2}", "{= 6x + 4}", "So {6x + 4 = 40}, which is what the question wanted to show"],
   mistakes:[["3x+2", "That is one length and one width. A rectangle has two of each."]]},
  {text:"The perimeter is {40 cm}, so {6x + 4 = 40}. Work out the length of the rectangle.", marks:2, type:"num", ans:15, post:"cm",
   tip:"Solve {6x + 4 = 40} to find x. Then put x into the length, {2x + 3}.",
   steps:["{6x + 4 = 40}, so {6x = 36} and {x = 6}", "Length {= 2x + 3 = 2 × 6 + 3}", "Length {= 15 cm}"],
   mistakes:[[6, "x = 6. Now put it into the length: 2 × 6 + 3."], [5, "5 cm is the width. The length is 2x + 3."]]},
  {text:"Sam is x years old. Mia is 3 years older than Sam. Leo is twice as old as Sam. Their ages add up to 51. Work out each person's age.", marks:4, type:"multi",
   fields:[{label:"Sam", ans:12}, {label:"Mia", ans:15}, {label:"Leo", ans:24}],
   tip:"Sam = {x}, Mia = {x + 3}, Leo = {2x}. Add them up and make it equal 51.",
   steps:["{x + (x + 3) + 2x = 51}", "{4x + 3 = 51}, so {4x = 48}", "{x = 12}: Sam is 12", "Mia is {12 + 3 = 15}, Leo is {2 × 12 = 24}"]},
  {text:"The nth term of a sequence is {4n + 3}. Is 150 a term in this sequence?", marks:2, type:"choice",
   options:[
     {t:"No. 4n + 3 = 150 gives n = 36.75, which is not a whole number", ok:true, why:"Term numbers must be whole numbers."},
     {t:"Yes. 4 × 37 + 3 = 150", why:"Check it: 4 × 37 = 148, and 148 + 3 = 151, not 150."},
     {t:"Yes. 150 is bigger than 3, so it will come up", why:"Not every number comes up. Solve 4n + 3 = 150 and see if n is a whole number."}],
   tip:"Solve {4n + 3 = 150}. Is n a whole number?",
   steps:["{4n + 3 = 150}", "{4n = 147}", "{n = 36.75}: not a whole number, so No"]},
  {text:"Here are the first four terms of a sequence: {5, 11, 17, 23}. Find the nth term.", marks:2, type:"expand", ans:"6n-1", show:"6n − 1",
   tip:"What does it go up by each time? That number goes in front of n.",
   steps:["It goes up by {6}, so it starts {6n}", "{6n} gives {6, 12, 18, 24}", "Each term is 1 less, so it is {6n − 1}"],
   mistakes:[["6n+5", "6n + 5 gives 11 for the first term, not 5. Compare 6n with the sequence: 6 → 5."], ["n+6", "The number it goes up by goes in front of n: 6n."], ["6n+1", "6n gives 6 for the first term. 5 is 1 less, so take 1 away."]]},
  {text:"The nth term of {5, 11, 17, 23} is {6n − 1}. Is 119 a term in this sequence?", marks:1, type:"choice",
   options:[
     {t:"Yes. 6n − 1 = 119 gives n = 20, so it is the 20th term", ok:true, why:"n = 20 is a whole number."},
     {t:"No. 119 is not in the 6 times table", why:"The terms are 1 less than the 6 times table. 120 is in it."},
     {t:"No. 6n − 1 = 119 gives n = 19.8", why:"Check it: 119 + 1 = 120, and 120 ÷ 6 = 20."}],
   tip:"Solve {6n − 1 = 119}. Is n a whole number?",
   steps:["{6n − 1 = 119}", "{6n = 120}", "{n = 20}: a whole number, so Yes, the 20th term"]}
 ]}
];
SESSIONS.forEach(s => s.qs.forEach(q => {
  if (q.type === "num") q.show = (q.pre ? q.pre + " " : "") + q.ans + (q.post ? " " + q.post : "");
  if (q.type === "multi") q.show = q.fields.map(f => f.label + " " + f.ans).join(", ");
  if (q.type === "choice") q.show = q.options.find(o => o.ok).t;
}));

/* ---------------- state ---------------- */
const S = {view:"home", sess:null, i:0, results:[], tries:0, help:0, done:false, msg:null, values:[], picked:[], best: LS.get("alg-best", {})};
function start(sess){ S.sess = sess; S.i = 0; S.results = []; resetQ(); S.view = "play"; render(); window.scrollTo(0, 0); focusInput(); }
function resetQ(){ S.tries = 0; S.help = 0; S.done = false; S.msg = null; S.values = []; S.picked = []; }
const Q = () => S.sess.qs[S.i];
const maxHelp = q => 1 + Math.max(0, q.steps.length - 1); // the tip, then every step except the last (that is the answer)

/* ---------------- checking ---------------- */
function judge(q, vals){
  // returns {ok} or {ok:false, text} or {nan:true}
  if (q.type === "num"){
    const v = asNumber(vals[0] || "");
    if (isNaN(v)) return {nan:true};
    if (Math.abs(v - q.ans) < 0.005) return {ok:true};
    const hit = (q.mistakes || []).find(([m]) => Math.abs(m - v) < 0.005);
    return {ok:false, text: hit ? hit[1] : null};
  }
  if (q.type === "multi"){
    const vs = q.fields.map((f, k) => asNumber(vals[k] || ""));
    if (vs.some(isNaN)) return {nan:true};
    const wrong = q.fields.filter((f, k) => Math.abs(vs[k] - f.ans) > 0.005).map(f => f.label);
    if (!wrong.length) return {ok:true};
    const sum = vs.reduce((a, b) => a + b, 0);
    return {ok:false, text: (Math.abs(sum - 51) > 0.005 ? "Your three ages do not add up to 51. " : "") + "Check " + wrong.join(" and ") + "."};
  }
  const raw = stripLead(norm(vals[0] || ""));
  if (!raw) return {nan:true};
  if (!compile(raw)) return {ok:false, text:"I can't read that. Use numbers, letters, + − and brackets, like this: " + plain(q.show).replace(/^[a-z] = /, "")};
  const hit = (q.mistakes || []).find(([m]) => same(raw, m));
  if (q.type === "expand"){
    if (same(raw, q.ans)) return raw.includes("(") ? {ok:false, text:"That is equal, but the brackets are still there. Multiply them out."} : {ok:true};
    return {ok:false, text: hit ? hit[1] : null};
  }
  if (q.type === "factor"){
    if (same(raw, q.ans)){
      const m = raw.match(/^(-?\d*\.?\d*[a-z]?)\((.+)\)$/);
      if (!m) return {ok:false, text:"That is equal, but it is not factorised. Put the common factor outside a bracket."};
      if (m[1] === q.outside) return {ok:true};
      return {ok:false, text:`That is not fully factorised. Something bigger than ${m[1] || "1"} goes into both parts.`};
    }
    return {ok:false, text: hit ? hit[1] : "Multiply your answer back out. Does it give the question?"};
  }
  if (q.type === "formula"){
    if (raw.includes(q.subject)) return {ok:false, text:`Your answer still has ${q.subject} in it. ${q.subject} should be on its own.`};
    if (same(raw, q.ans)) return {ok:true};
    return {ok:false, text: hit ? hit[1] : null};
  }
  return {ok:false};
}
function check(){
  const q = Q();
  S.values = readInputs();
  const r = judge(q, S.values);
  if (r.nan){ S.msg = {type:"nan"}; render(); shake(); return; }
  if (r.ok){ finish(true); return; }
  wrong(r.text);
}
function pick(k){
  const q = Q(), o = q.options[k];
  if (S.done || S.picked.includes(k)) return;
  S.picked.push(k);
  if (o.ok){ finish(true); return; }
  wrong(o.why);
}
function finish(ok, text){
  S.results[S.i] = ok ? ((S.tries === 0 && S.help === 0) ? 3 : 1) : 0;
  S.done = true; S.msg = {type: ok ? "right" : "reveal", text};
  render(); document.getElementById("nextBtn")?.focus();
}
function wrong(text){
  S.tries++;
  if (S.tries >= 2){ finish(false, text); return; }
  S.msg = {type:"wrong", text: text || "Not quite. Press Help me for a hint."};
  if (Q().type !== "choice") S.values = S.values.map(() => "");
  render(); shake(); focusInput();
}
function readInputs(){ return [...document.querySelectorAll(".ans")].map(el => el.value); }

/* ---------------- views ---------------- */
function bar(){
  return `<header class="bar"><button class="brand" data-act="home" aria-label="Algebra home"><span class="logo">x+y</span><span>Algebra Practice</span></button>
    <a class="btn ghost sm" href="../" aria-label="All topics">Topics</a>
    <button class="iconbtn" data-act="speak" aria-label="Read the question aloud" title="Read aloud" ${S.view === "play" ? "" : "hidden"}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button></header>`;
}
function homeView(){
  return `${bar()}
  <div style="display:flex;flex-direction:column;gap:8px"><h1>Pick a session</h1>
  <p class="muted">Answer each question, then press Check. Stuck? Press Help me for one step at a time.</p></div>
  <div class="sessions">${SESSIONS.map((s, i) => `<button class="session" data-act="session" data-i="${i}">
    <span class="top"><span class="num">${i + 1}</span><span class="best">${S.best[s.id] != null ? "Best: " + S.best[s.id] + " / " + s.qs.length * 3 + " stars" : "Not tried yet"}</span></span>
    <b>${esc(s.name)}</b><span class="eg">${esc(s.eg)} ${s.qs.length} questions.</span></button>`).join("")}</div>
  <div class="tipcard"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>
  <p><b>Typing algebra:</b> type <b>4x + 20</b> as it looks. Use the buttons for brackets, minus and squared. For divide, use <b>÷</b> or <b>/</b>.</p></div>`;
}
function dots(){ return `<div class="dots" aria-hidden="true">${S.sess.qs.map((_, i) => `<i class="${i < S.results.length && S.results[i] != null ? "s" + S.results[i] : ""} ${i === S.i ? "now" : ""}"></i>`).join("")}</div>`; }
function keysFor(q){
  if (q.type === "num" || q.type === "multi") return ["−", "."];
  const letters = [...new Set(plain(q.show).replace(/^[a-z] = /, "").match(/[a-z]/g) || [])];
  const k = [...letters, "(", ")", "+", "−"];
  if (q.type === "factor" && q.ans.includes("x(")) k.push("²");
  if (q.type === "formula") k.push("÷");
  return k;
}
function inputsHTML(q){
  const text = q.type !== "num" && q.type !== "multi";
  const attrs = `autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="${text ? "text" : "decimal"}"`;
  if (q.type === "multi") return `<div class="fields">${q.fields.map((f, k) => `<label class="field"><span>${esc(f.label)}</span><input class="ans" ${attrs} aria-label="${esc(f.label)}'s age" value="${esc(S.values[k] || "")}"><span>years</span></label>`).join("")}</div>`;
  return `<div class="fields"><label class="field">${q.pre ? `<span>${esc(q.pre)}</span>` : ""}<input class="ans" ${attrs} placeholder="Your answer" aria-label="Your answer" value="${esc(S.values[0] || "")}">${q.post ? `<span>${esc(q.post)}</span>` : ""}</label></div>`;
}
function playView(){
  const q = Q(), n = S.sess.qs.length;
  const helpOn = S.help > 0 && !S.done;
  const helpLines = [q.tip, ...q.steps.slice(0, Math.max(0, S.help - 1))];
  return `${bar()}
  <div class="playtop"><button class="btn ghost sm" data-act="home">Stop</button>${dots()}<span class="small muted">Question ${S.i + 1} of ${n}</span></div>
  <div class="qcard">
    <span class="eyebrow">${esc(S.sess.name)}</span>
    <p class="qtext">${fmt(q.text)} <span class="marks">${q.marks} mark${q.marks > 1 ? "s" : ""}</span></p>
    ${q.working ? `<div class="working" aria-label="Amir's working">${q.working.map(l => `<span>${esc(l)}</span>`).join("")}</div>` : ""}
    ${q.ask ? `<p class="qtext">${fmt(q.ask)}</p>` : ""}
    ${helpOn ? `<div class="help"><p class="small"><b>Help</b></p><ol class="steps">${helpLines.map(t => `<li>${fmt(t)}</li>`).join("")}</ol>
       ${S.help < maxHelp(q) ? `<div><button class="btn ghost sm" data-act="help">Next step</button></div>` : ""}</div>` : ""}
    ${!S.done && q.type === "choice" ? `<div class="choices">${q.options.map((o, k) => `<button class="choice ${S.picked.includes(k) ? "picked-no" : ""}" data-act="pick" data-k="${k}" ${S.picked.includes(k) ? "disabled" : ""}>${esc(o.t)}</button>`).join("")}</div>
       ${S.help === 0 ? `<div><button class="btn ghost sm" data-act="help">Help me</button></div>` : ""}` : ""}
    ${!S.done && q.type !== "choice" ? `${inputsHTML(q)}
       <div class="keys" role="group" aria-label="Maths symbols">${keysFor(q).map(k => `<button data-act="key" data-k="${esc(k)}" aria-label="${k === "−" ? "minus" : k === "²" ? "squared" : k === "÷" ? "divide" : esc(k)}">${esc(k)}</button>`).join("")}<button data-act="back" aria-label="Delete">⌫</button></div>
       <div class="actions">${S.help < maxHelp(q) ? `<button class="btn ghost" data-act="help">Help me</button>` : `<button class="btn ghost" data-act="clear">Clear</button>`}<button class="btn teal" data-act="check">Check</button></div>` : ""}
    ${S.msg ? feedbackHTML(q) : ""}
  </div>`;
}
function feedbackHTML(q){
  const m = S.msg;
  if (m.type === "nan") return `<div class="feedback no" role="alert"><span class="head">Type your answer first</span><p>${q.type === "num" || q.type === "multi" ? "Numbers only. You do not need to type the units." : "For example: " + esc(plain(q.show).replace(/^[a-z] = /, ""))}</p></div>`;
  if (m.type === "wrong") return `<div class="feedback no" role="alert"><span class="head">Not yet. Have another go.</span><p>${fmt(m.text)}</p></div>`;
  const ok = m.type === "right", stars = S.results[S.i];
  const why = q.type === "choice" && ok ? q.options.find(o => o.ok).why : "";
  return `<div class="feedback ${ok ? "ok" : "no"}" role="status">
    <span class="head">${ok ? (stars === 3 ? "Yes! First time, no help." : "Yes, that's right.") : "The answer is " + esc(plain(q.show)) + "."}</span>
    ${!ok && m.text ? `<p>${fmt(m.text)}</p>` : ""}${why ? `<p>${fmt(why)}</p>` : ""}
    <ol class="steps">${q.steps.map(s => `<li>${fmt(s)}</li>`).join("")}</ol>
    <div class="row"><button class="btn ${ok ? "good" : "teal"}" data-act="next" id="nextBtn">${S.i + 1 < S.sess.qs.length ? "Next question" : "See my score"}</button></div>
  </div>`;
}
function endView(){
  const qs = S.sess.qs, total = S.results.reduce((a, b) => a + (b || 0), 0), max = qs.length * 3;
  const firstTime = S.results.filter(s => s === 3).length, correct = S.results.filter(s => s > 0).length;
  const prev = S.best[S.sess.id], isBest = prev == null || total > prev;
  if (isBest){ S.best[S.sess.id] = total; LS.set("alg-best", S.best); }
  const big = total / max >= .8 ? 3 : total / max >= .5 ? 2 : 1;
  const star = f => `<svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z" fill="${f}" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
  return `${bar()}
  <div class="qcard" style="align-items:center;text-align:center">
    <div class="stars">${[0,1,2].map(i => star(i < big ? "var(--sun)" : "var(--surface-2)")).join("")}</div>
    <p class="score">${total} <span class="small muted">/ ${max} stars</span></p>
    <p><b>${correct} of ${qs.length}</b> right, and <b>${firstTime}</b> first time with no help.${isBest && prev != null ? " That is a new best." : ""}</p>
    <p class="small muted">3 stars: right first time with no help. 1 star: right after help or a second go.</p>
    <div class="row" style="justify-content:center"><button class="btn" data-act="again">Try again</button><button class="btn ghost" data-act="home">Change session</button></div>
  </div>
  <h2>Your questions</h2>
  <div class="review">${qs.map((q, i) => `<div class="rv"><span class="pip s${S.results[i]}">${S.results[i] === 3 ? "3★" : S.results[i] === 1 ? "1★" : "–"}</span>
    <div><p class="small">${fmt(q.text)}${q.ask ? " " + fmt(q.ask) : ""}</p><p class="small"><b>Answer: ${esc(plain(q.show))}</b></p></div></div>`).join("")}</div>`;
}
function render(){
  document.getElementById("app").innerHTML = S.view === "play" ? playView() : S.view === "end" ? endView() : homeView();
}
function focusInput(){ if (matchMedia("(pointer: fine)").matches){ const el = document.querySelector(".ans"); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } }
function shake(){ const f = document.querySelector(".fields, .choices"); if (f){ f.classList.add("shake"); setTimeout(() => f.classList.remove("shake"), 350); } }
let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.classList?.contains("ans")) lastInput = e.target; });
function insertKey(k){
  const el = (lastInput && document.body.contains(lastInput)) ? lastInput : document.querySelector(".ans"); if (!el) return;
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0, a) + k + el.value.slice(b);
  const p = a + k.length; try { el.setSelectionRange(p, p); } catch(e){}
  S.values = readInputs();
}
function speak(){
  try { const q = Q(), ss = window.speechSynthesis; if (!ss) return; ss.cancel();
    let t = plain(q.text + " " + (q.working ? "His working: " + q.working.join(". ") + ". " : "") + (q.ask || ""));
    if (q.type === "choice") t += " " + q.options.map((o, k) => "Option " + (k + 1) + ": " + o.t + ".").join(" ");
    t = t.replace(/²/g, " squared").replace(/(\d)\s*−\s*(\d)/g, "$1 minus $2").replace(/−/g, " minus ").replace(/×/g, " times ").replace(/÷/g, " divided by ").replace(/°/g, " degrees").replace(/\bnth\b/g, "n-th");
    const u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = .9;
    const v = ss.getVoices().find(x => /en-GB/i.test(x.lang)); if (v) u.voice = v; ss.speak(u); } catch(e){}
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "home"){ S.view = "home"; render(); history.replaceState(null, "", location.pathname); window.scrollTo(0, 0); }
  else if (act === "session") start(SESSIONS[Number(b.dataset.i)]);
  else if (act === "again") start(S.sess);
  else if (act === "speak") speak();
  else if (act === "help"){ if (Q().type !== "choice") S.values = readInputs(); S.help = Math.min(maxHelp(Q()), S.help + 1); if (S.msg && S.msg.type === "nan") S.msg = null; render(); }
  else if (act === "check") check();
  else if (act === "pick") pick(Number(b.dataset.k));
  else if (act === "key") insertKey(b.dataset.k);
  else if (act === "back"){ const el = (lastInput && document.body.contains(lastInput)) ? lastInput : document.querySelector(".ans"); if (el){ el.value = el.value.slice(0, -1); S.values = readInputs(); } }
  else if (act === "clear"){ document.querySelectorAll(".ans").forEach(el => el.value = ""); S.values = []; }
  else if (act === "next"){ if (S.i + 1 < S.sess.qs.length){ S.i++; resetQ(); render(); window.scrollTo(0, 0); focusInput(); } else { S.view = "end"; render(); window.scrollTo(0, 0); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && S.view === "play"){
    if (S.done){ e.preventDefault(); document.getElementById("nextBtn")?.click(); }
    else if (e.target.classList?.contains("ans")){ e.preventDefault(); check(); }
  }
});
document.addEventListener("input", e => { if (e.target.classList?.contains("ans")) S.values = readInputs(); });

// The cover page links straight to a session with #s1 or #s2.
const fromHash = SESSIONS.find(s => "#" + s.id === location.hash);
if (fromHash) start(fromHash); else render();
</script>
</body>
</html>
